<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting to Google…</title>
  <meta http-equiv="refresh" content="0;url={{ provider_login_url|default:'/accounts/google/login/?process=login' }}">
</head>
<body>
<form method="post" id="go">
  {% csrf_token %}
  <button type="submit" style="display:none">Continue</button>
</form>
<script>
  document.getElementById('go').submit();
</script>
<p style="font-family:sans-serif;text-align:center;margin-top:40px;color:#555">Redirecting to Google…</p>
</body>
</html>
